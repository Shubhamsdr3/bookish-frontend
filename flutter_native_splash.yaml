# Single source of truth for native splash on Android + iOS.
# Regenerate after logo/color changes:
#   fvm flutter pub get
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/image/logo.png
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center

  # Android 12+ masks the splash icon; use a padded logo so the full mark fits.
  android_12:
    color: "#FFFFFF"
    image: assets/image/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
