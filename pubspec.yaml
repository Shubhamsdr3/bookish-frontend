name: bookish
description: "Bookish Flutter app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  injectable: ^3.0.0
  easy_localization: ^3.0.0
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.14
  pin_code_fields: ^10.1.0
  english_words: ^4.0.0
  alice: ^1.0.0
  alice_dio: ^1.0.7
  convert: ^3.1.1
  flutter_spinkit: ^5.2.0
  intl: any
  cached_network_image: any
  flutter_otp_text_field: ^1.1.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  fluttertoast: ^10.0.0
  image_picker: ^1.0.4
  firebase_storage: ^12.4.10
  firebase_app_check: ^0.3.2+10
  shimmer: ^4.0.0
  google_fonts: ^8.2.1
  flutter_rating_bar: ^4.0.1
  flutter_html: ^3.0.0-beta.2
  package_info_plus: ^8.0.0
  flutter_staggered_grid_view: ^0.7.0
  camera: ^0.12.1
  cloud_firestore: ^5.6.12
  go_router: ^18.0.1
  path_provider: ^2.0.3
  share_plus: ^11.1.0
  flutter_emoji_feedback: ^1.0.3
  lottie: ^3.1.3
  flutter_dotenv: ^6.0.0
  google_sign_in: ^7.1.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  dio: ^5.4.0
  get: ^4.6.6
  flutter_displaymode: ^0.7.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  connectivity_plus: ^6.0.3
  webview_flutter: ^4.8.0
  sqflite: ^2.3.3+1
  path: ^1.8.3
  firebase_crashlytics: ^4.1.0
  socket_io_client: ^3.0.0
  flutter_flavor: ^3.1.3
  pinput: ^6.0.1
  internet_connection_checker: ^3.0.1
  video_player: ^2.10.0
  video_compress: ^3.1.4
  flutter_riverpod: ^3.3.1
  uuid: ^4.0.0
  flutter_native_splash: ^2.4.6

  network_service:
    path: ./network_service

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  curl_logger_dio_interceptor: ^1.0.0

dependency_overrides:
  html: 0.15.5
  package_info_plus: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/lottie/
    - assets/env/.env_prod
    - assets/web/web_view.html
